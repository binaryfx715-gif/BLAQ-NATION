<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLAQ NATION 🥷</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:Arial,sans-serif}
.wrap{max-width:520px;margin:auto;min-height:100vh;padding:22px}
.logo{width:76px;height:76px;border:2px solid #d6a52b;border-radius:50%;display:grid;place-items:center;margin:10px auto;color:#d6a52b;font-size:34px}
h1{text-align:center;letter-spacing:3px;margin:8px 0 2px}.tag{text-align:center;color:#aaa;margin-bottom:28px}
.card{background:#111;border:1px solid #292929;border-radius:18px;padding:18px;margin:14px 0}
.gold{color:#d6a52b}.quote{font-size:22px;font-weight:700;line-height:1.3}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#d6a52b;color:#080808;font-weight:800;font-size:15px;margin-top:12px}
nav{position:sticky;bottom:10px;background:#111;border:1px solid #292929;border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav button{margin:0;background:#191919;color:#eee;font-size:12px;padding:10px 4px}.page{display:none}.page.active{display:block}
input,textarea{width:100%;background:#0b0b0b;border:1px solid #333;color:#fff;border-radius:10px;padding:12px;margin-top:8px}
.stat{display:inline-block;width:31%;text-align:center;background:#181818;padding:12px 4px;border-radius:12px;margin-right:1%}
</style></head>
<body><div class="wrap">
<div class="logo">🥷</div><h1>BLAQ NATION</h1><div class="tag">MOVE IN SILENCE. BUILD YOUR LEGACY.</div>

<section id="home" class="page active">
<div class="card"><div class="gold">TODAY'S MISSION</div><div class="quote" id="quote"></div><button onclick="newQuote()">NEW MOTIVATION</button></div>
<div class="card"><div class="gold">DAILY CHECK-IN</div><div>Did you complete today's mission?</div><button onclick="complete()">MARK COMPLETE 🔥</button><p id="status"></p></div>
</section>

<section id="goals" class="page"><div class="card"><h2>🎯 Goals</h2><input id="goal" placeholder="Write your goal..."><button onclick="addGoal()">ADD GOAL</button><div id="goalsList"></div></div></section>

<section id="habits" class="page"><div class="card"><h2>🔥 Habits</h2><p>Track the habits that build your future.</p><button onclick="streak()">CHECK IN TODAY</button><h2 id="streak">0 day streak</h2></div></section>

<section id="journal" class="page"><div class="card"><h2>📓 Private Journal</h2><textarea id="note" rows="9" placeholder="Write your thoughts..."></textarea><button onclick="saveNote()">SAVE NOTE</button><p id="saved"></p></div></section>

<nav><button onclick="show('home')">🏠<br>Home</button><button onclick="show('goals')">🎯<br>Goals</button><button onclick="show('habits')">🔥<br>Habits</button><button onclick="show('journal')">📓<br>Journal</button></nav>
</div>
<script>
const quotes=["Discipline beats motivation when motivation fades.","Your future is built by what you do today.","Stay focused. Let your results speak.","Small progress is still progress.","Protect your time. Protect your goals.","Move in silence. Build your legacy."];
let q=0; function newQuote(){q=(q+1)%quotes.length;document.querySelector('#quote').textContent=quotes[q]}
newQuote();
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function complete(){localStorage.setItem('complete',new Date().toDateString());document.getElementById('status').textContent="Mission complete. Keep going. 🥷"}
let goals=JSON.parse(localStorage.getItem('goals')||'[]');function render(){document.getElementById('goalsList').innerHTML=goals.map((g,i)=>`<p>☐ ${g}</p>`).join('')}function addGoal(){let x=document.getElementById('goal');if(x.value.trim()){goals.push(x.value.trim());localStorage.setItem('goals',JSON.stringify(goals));x.value='';render()}}render();
function streak(){let n=+localStorage.getItem('streak')||0;n++;localStorage.setItem('streak',n);document.getElementById('streak').textContent=n+' day streak 🔥'}
document.getElementById('note').value=localStorage.getItem('note')||'';function saveNote(){localStorage.setItem('note',document.getElementById('note').value);document.getElementById('saved').textContent='Saved on this device ✓'}
</script></body></html>
